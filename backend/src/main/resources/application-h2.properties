# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Uses an embedded file database in ./data — no MySQL installation needed.
spring.datasource.url=jdbc:h2:file:./data/questhive;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
