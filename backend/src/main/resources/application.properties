# Every setting reads an environment variable first (used when deployed) and falls back
# to the local default after the colon. For your own MySQL password, create
# backend/secrets.properties (it is git-ignored, so it never reaches GitHub) containing:
#   spring.datasource.password=YOUR_MYSQL_PASSWORD
spring.config.import=optional:file:./secrets.properties

# ---------- Server ----------
server.port=${PORT:8080}
spring.application.name=questhive-backend

# ---------- MySQL ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/questhive?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
# Send inserts in batches of 50 instead of one by one (much faster on a cloud database)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# ---------- App ----------
# Websites allowed to call this API (comma separated; wildcards allowed, e.g. https://*.vercel.app)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Platform commission taken from each paid class
app.commission=0.15

# ---------- Admin login ----------
app.admin.email=${ADMIN_EMAIL:admin@questhive.demo}
app.admin.password=${ADMIN_PASSWORD:admin123}
# Password given to every seeded demo learner and teacher
app.demo.password=${DEMO_PASSWORD:demo1234}
